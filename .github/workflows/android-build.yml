name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build ASIFBOT
    runs-on: ubuntu-latest
    env:
      ASIFBOT_API_BASE_URL: ${{ vars.ASIFBOT_API_BASE_URL || secrets.ASIFBOT_API_BASE_URL }}
      ASIFBOT_DEMO_MODE: ${{ vars.ASIFBOT_DEMO_MODE || secrets.ASIFBOT_DEMO_MODE }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK and release bundle
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug :app:bundleRelease --stacktrace --info \
            -PASIFBOT_API_BASE_URL="${ASIFBOT_API_BASE_URL:-http://asifbot.duckdns.org:8080}" \
            -PASIFBOT_DEMO_MODE="${ASIFBOT_DEMO_MODE:-false}" 2>&1 | tee build-log.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "---- Build error summary ----"
            grep -n -i -E 'FAILURE|What went wrong|Execution failed|Could not|error:|Caused by|Exception|Required|installed|compileSdk|Android SDK|failed' build-log.txt | head -n 80 > failure-summary.txt || true
            if [ ! -s failure-summary.txt ]; then
              tail -n 80 build-log.txt > failure-summary.txt
            fi
            cat failure-summary.txt
            echo "---- Last build log lines ----"
            tail -n 120 build-log.txt
            message=$(cat failure-summary.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$message"
            exit "$status"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ASIFBOT-build-log
          path: build-log.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ASIFBOT-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ASIFBOT-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
